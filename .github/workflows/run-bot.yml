name: Run Headless Browser Task

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" on GitHub

jobs:
  run-browser-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Installs the automated headless chrome browser onto the virtual machine
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Execute Automation Script
      run: python bot.py
